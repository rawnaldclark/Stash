name: Unit tests

# Runs JVM unit tests on push and PR. The repo previously had no test CI —
# only release.yml, which builds the APK on `v*` tags. This validates the
# media module (playback resume, queue, streaming) on every change and also
# builds a debug APK artifact for manual on-device testing.

on:
  push:
    paths-ignore: ['web/**']
  pull_request:
    paths-ignore: ['web/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Compiles the unit-test source set of EVERY module. This is the gate the
  # repo was missing: `unit-tests` below runs only :core:media, and
  # `assembleDebug` compiles main sources only — so a test that no longer
  # compiles (e.g. a ViewModel gaining a constructor param without its test
  # being updated, PR #305) produced ZERO CI signal and shipped through five
  # releases. This job catches that class on every push/PR. No `[skip test]`
  # hatch: a compile break must never be skippable. Fast (no test execution),
  # zero flakiness.
  compile-tests:
    name: Compile all unit tests
    if: >-
      github.event_name != 'push' ||
      github.ref == 'refs/heads/master' ||
      contains(github.event.head_commit.message, '[do test]')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Fix gradlew permission
        run: chmod +x gradlew

      # `--continue` for the same reason as the unit-tests job: a compile error
      # in one module otherwise hides every other module's.
      # Tuning's pitch engine is native code (core/media/src/main/cpp). The same NDK and CMake
      # versions as core/media/build.gradle.kts pins: change them together.
      - name: Install NDK and CMake
        run: echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null

      - name: Compile every module's unit tests
        run: ./gradlew compileDebugUnitTestKotlin --continue --no-daemon

  # The share Worker's tests (mixes, rooms, Community), then the sync Worker, tip jar, Tidal relay, lossless config
  # publisher and Last.fm proxy.
  # They import only local files, so no npm install.
  worker-tests:
    name: Share worker tests
    if: >-
      github.event_name != 'push' ||
      github.ref == 'refs/heads/master' ||
      contains(github.event.head_commit.message, '[do test]')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run the Worker's tests
        working-directory: infra/share-worker
        run: node --no-warnings --test test/*.test.js

      # The sync Worker (linking with Stash on the web): pairing, spaces, limits, retention. node:sqlite stands in for
      # the Durable Objects' SQLite; local imports only.
      - name: Run the sync Worker's tests
        working-directory: infra/sync-worker
        run: node --no-warnings --test test/*.test.js

      # The tip jar (supporters list, Ko-fi webhook, stashfm.app early access). Local imports only too.
      - name: Run the tip jar's tests
        working-directory: infra/tipjar-worker
        run: node --no-warnings --test test/*.test.js

      # The Tidal relay (seats, pacing, caps, the daily lossless counter, supporter tokens): the most
      # abuse-sensitive Worker, so its suite must not only run by hand. node:sqlite stands in for D1; local imports only.
      - name: Run the Tidal relay's tests
        working-directory: infra/tidal-relay
        run: node --no-warnings --test test/*.test.js

      # The signed lossless.json publisher (Tidal relay url/token, relay_key, the relays kill switch). Local imports only.
      - name: Run the lossless config publisher's tests
        working-directory: infra/lossless-config
        run: node --no-warnings --test test/*.test.js

      # The Last.fm proxy (param allowlist, canonical cache key, per-network miss limit). Local imports only.
      - name: Run the Last.fm proxy's tests
        working-directory: infra/lastfm-proxy
        run: node --no-warnings --test test/*.test.js

  # Runs EVERY module's unit tests, not just :core:media.
  #
  # This job used to execute one module of fifteen — 345 of 1892 tests — so a
  # break anywhere else (all of :core:data's DAO and sync-worker coverage
  # included) reached a release unchallenged. It stayed that narrow because the
  # rest of the suite was red: ~28 known failures nobody wanted to quarantine,
  # plus a deadlocked :core:media test that hung the job until the 20-minute cap
  # killed it, on every single push.
  #
  # Both are fixed (2026-07-25, e325103b + f03f46ba). The whole repo is green —
  # 1892 tests, 15 modules — so there is nothing left to quarantine and no
  # reason for the gate to keep ignoring 82% of it.
  #
  # `--continue` so one failing module still reports the others; without it the
  # first failure masks everything behind it and you fix bugs one CI round-trip
  # at a time.
  unit-tests:
    name: All module unit tests
    if: >-
      github.event_name != 'push' ||
      github.ref == 'refs/heads/master' ||
      contains(github.event.head_commit.message, '[do test]')
    runs-on: ubuntu-latest
    # Job cap retained. It was added when a hung :core:media squatted a
    # concurrency slot for the 6h default — 20 pushes in a day froze the whole
    # account's Actions queue and blocked the v0.9.78 release build
    # (2026-07-19). The hang is fixed, but the cap is the thing that bounds the
    # damage if another test ever wedges, so it stays. Full sweep runs in ~3-4
    # min; 20 leaves generous headroom.
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Fix gradlew permission
        run: chmod +x gradlew

      # Tuning's pitch engine is native code (core/media/src/main/cpp). The same NDK and CMake
      # versions as core/media/build.gradle.kts pins: change them together.
      - name: Install NDK and CMake
        run: echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null

      - name: Run all unit tests
        run: ./gradlew testDebugUnitTest --continue --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-results
          path: |
            **/build/test-results/testDebugUnitTest/
            **/build/reports/tests/testDebugUnitTest/

  build-debug-apk:
    if: >-
      github.event_name != 'push' ||
      (github.ref == 'refs/heads/master' && !contains(github.event.head_commit.message, '[skip test]')) ||
      (github.ref != 'refs/heads/master' && contains(github.event.head_commit.message, '[do test]'))
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Fix gradlew permission
        run: chmod +x gradlew

      # Tuning's pitch engine is native code (core/media/src/main/cpp). The same NDK and CMake
      # versions as core/media/build.gradle.kts pins: change them together.
      - name: Install NDK and CMake
        run: echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null

      - name: Assemble debug APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Locate debug APK
        id: find_apk
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::No debug APK produced by assembleDebug"
            exit 1
          fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "Built: $APK ($(du -h "$APK" | cut -f1))"

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: stash-debug-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
