name = "stash-relay"
main = "src/index.js"
# nodejs_compat is on by default from 2026-08-04; declared anyway so node:crypto is an explicit dependency.
compatibility_date = "2026-08-04"
compatibility_flags = ["nodejs_compat"]

# Caps (spec §5.4, §6.2, §7). Strings: TOML vars reach the Worker as strings.
[vars]
GLOBAL_DAILY_CAP = "34667"     # 13×2000 was 26000; raised ~33% on 2026-10-03 after 6 seats were added on 09-22
INSTALL_DAILY_CAP = "500"      # doubled 300→600 on 09-11; raised to 800 (~33%) on 10-03; lowered to 500 on 10-08
ACCOUNT_HOURLY_CAP = "621"     # 467→621 (~33%) on 2026-10-14; 350→467 on 2026-10-03; 100/h failed for all 7 accounts on 09-19
ACCOUNT_DAILY_CAP = "11000"    # 8000→11000 on 2026-10-13; originally doubled 1000→2000 on 09-08
ACCOUNT_UNCAPPED_LABELS = "acct-new-5,acct-new-6" # bypasses only these accounts' hourly/daily limits; shared/install/network limits remain
ACCOUNT_NO_COOLDOWN_LABELS = "acct-new-5" # transient upstream failures won't cool this account; other limits still apply
DOWNLOAD_PACE_HEADROOM_PCT = "13" # 10→13 (+30%) on 2026-10-03; streams first, downloads take what the pool can spare
# Per network (IPv4 address, IPv6 /56), added 2026-10-11 so a script rotating install ids can't take the whole
# global cap. Both need the IP_SALT secret; without it they are off.
NETWORK_DAILY_CAP = "2000"     # 4 installs' worth: a household or a carrier NAT still fits
NETWORK_FREE_404_DAILY = "100" # Qobuz 404s (unknown ids) that spare the network cap (they still spend global + account); past it they count
# An IPv6 caller is also capped by its /48 as a whole (one tunnel-broker /48 holds 256 /56s). Unset here on purpose:
# NETWORK48_DAILY_CAP defaults to 4 × NETWORK_DAILY_CAP and NETWORK48_FREE_404_DAILY to 4 × NETWORK_FREE_404_DAILY.
# The daily lossless counter shared with the Tidal relay (QUOTA_DB below): free lossless answers per install per
# UTC day, Qobuz and Tidal together. Over it: 429 daily_lossless_cap. INSTALL_DAILY_CAP above stays as the
# relay's own per-install cap and abuse telemetry.
FREE_LOSSLESS_DAILY = "400" # 500→400 on 2026-10-20
# Supporters (X-Stash-Entitlement token from the tip jar, src/quota.js): unlimited lossless, verified with this
# Ed25519 public key (standard base64 of the raw 32 bytes; public by design, the private half is the tip jar's
# secret). SUPPORTER_DAILY_CAP is the per-token safety ceiling: past it that day the token counts as free.
# Supporters skip INSTALL_DAILY_CAP; the network, /48 and global caps still apply. Same values as the Tidal relay.
ENTITLEMENT_PUBLIC_KEY = "IbghbSB8gJcuHbpSEf8tRKfCwzBfB14eBPew3nVkQFQ="
SUPPORTER_DAILY_CAP = "5000"

# Rotation state, mint cache, daily counters (spec §5.2: D1, not KV, because of KV's write limit).
[[d1_databases]]
binding = "DB"
database_name = "stash-relay"
database_id = "b223d4c7-ba0a-41fa-948d-2a41d29dfdbb"   # printed by `npx wrangler d1 create stash-relay` (Task 9)
migrations_dir = "migrations"

# The shared daily lossless counter (src/quota.js), one database for both relays. Schema and its migrate
# command: infra/lossless-quota/ (`--config infra/lossless-quota/wrangler.toml`). Unbound = counter off.
[[d1_databases]]
binding = "QUOTA_DB"
database_name = "stash-quota"
database_id = "f5c12428-cd59-4181-bbcf-9d368a11c495"
migrations_dir = "../lossless-quota/migrations"

# Per-IP cap in front of everything (spec §5.4). Counts every /v1/qobuz/file request, hits included.
# Keyed per network (IPv4 address, IPv6 /56) since 2026-10-11, so rotating IPv6 addresses doesn't buy new buckets.
[[ratelimits]]
name = "MINT_RL"
namespace_id = "1001"
simple = { limit = 40, period = 60 } # raised from 30 (+33%) on 2026-10-03

# Hourly prune of expired mints and stale quota rows.
[triggers]
crons = ["17 * * * *"]

# Secrets: `npx wrangler secret put <NAME>`, never committed.
#   RELAY_KEY       hex HMAC key. The SAME value is published as `relay_key` in lossless.json.
#   RELAY_KEY_PREV  optional: the previous key, accepted during a rotation window.
#   QOBUZ_ACCOUNTS  JSON array of {"label","token","app_id","app_secret"} entries from scripts/login.mjs.
#   QOBUZ_ACCOUNTS_EXTRA  optional additive JSON array; lets the pool grow without replacing QOBUZ_ACCOUNTS.
#   QOBUZ_ACCOUNTS_RECOVERED through QOBUZ_ACCOUNTS_RECOVERED_4 are optional additive JSON arrays.
#   IP_SALT         random secret salting the stored network hash. Turns on the per-network caps above and the
#                   IP column `npm run report` reads. Never the relay key (that one is public).
