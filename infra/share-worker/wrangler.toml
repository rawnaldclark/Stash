name = "stash-share"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Two hosts, one Worker (stashfm.app contract 2026-10-03). Every link is built from the request's own origin:
# stashfm.app requests get stashfm.app links, and stash-share.rawnaldclark.workers.dev keeps serving (and
# answering with) workers.dev links forever, for links already shared and for older app versions.
workers_dev = true
# The route needs a proxied DNS record for stashfm.app before it serves anything (README "Deploy").
# When the stashfm.app website ships, the site takes `stashfm.app/*` and this Worker keeps only its own paths:
#   stashfm.app/m/*  stashfm.app/t*  stashfm.app/l/*  stashfm.app/v1/*  stashfm.app/.well-known/assetlinks.json
# (`/t*` also catches any site page starting with /t; if that matters, use `stashfm.app/t` plus `stashfm.app/t/*`,
# after checking that `stashfm.app/t` still matches `/t?…` links, since route patterns can't carry a query.)
routes = [{ pattern = "stashfm.app/*", zone_name = "stashfm.app" }]

# Created in Task 23: `npx wrangler kv namespace create SHARE_KV`, then paste the id.
[[kv_namespaces]]
binding = "SHARE_KV"
id = "94631ba84a3d4c7da690c4d2dc7a19c8"

# A ratelimits binding carries ONE fixed limit, so creating and writing get one each (spec §4).
[[ratelimits]]
name = "CREATE_RL"
namespace_id = "2001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "WRITE_RL"
namespace_id = "2002"
simple = { limit = 30, period = 60 }

# POST /v1/tracks, short song links (contract 2026-10-03). Higher than CREATE_RL: sharing songs is quick and frequent.
[[ratelimits]]
name = "TRACK_RL"
namespace_id = "2008"
simple = { limit = 30, period = 60 }

# Song pages' album-art lookups (Spotify oEmbed, Deezer) per IP, so the Worker can't be used to hammer them. Over it,
# a page shows YouTube's hqdefault, or no image, instead. Only real lookups count: stored and cached art don't.
[[ratelimits]]
name = "ART_RL"
namespace_id = "2009"
simple = { limit = 60, period = 60 }

# Listen Together (spec 2026-09-24 §2): one Durable Object per room, reached over WebSockets.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "ListenRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ListenRoom"]

[[ratelimits]]
name = "ROOM_RL"
namespace_id = "2003"
simple = { limit = 5, period = 60 }

# GET /v1/rooms/{code}, /v1/rooms/{code}/ws and /l/{code}, checked before any Durable Object (spec §2).
[[ratelimits]]
name = "JOIN_RL"
namespace_id = "2004"
simple = { limit = 60, period = 60 }

# Stash Community (spec docs/superpowers/specs/2026-09-26-stash-community-design.md §2).
[[d1_databases]]
binding = "COMMUNITY_DB"
database_name = "stash-community"
database_id = "dfbf6783-001d-40ce-9412-1e56c9ab2d84"
migrations_dir = "migrations"

[[ratelimits]]
name = "COMMUNITY_WRITE_RL"
namespace_id = "2005"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "COMMUNITY_VOTE_RL"
namespace_id = "2006"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "COMMUNITY_READ_RL"
namespace_id = "2007"
simple = { limit = 120, period = 60 }

[triggers]
crons = ["17 4 * * *"]
