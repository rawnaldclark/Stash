name = "stash-tipjar"
main = "src/index.js"
compatibility_date = "2026-05-01"

# KV namespace binding. `id` is filled by `wrangler kv:namespace create
# STASH_KV` — see ../README.md step 3.
[[kv_namespaces]]
binding = "STASH_KV"
id = "fca1bc38b42741e6a8cac11f54de5abd"

# stashfm.app early access (src/access.js): the access list and the monthly goal.
# Its own namespace, so the website Worker (web/wrangler.jsonc binds the same one)
# never gets STASH_KV. TODO(owner): create it once and paste its id here AND in
# web/wrangler.jsonc:  npx wrangler kv namespace create stash-early-access
# A deploy fails until the placeholder is replaced, on purpose.
[[kv_namespaces]]
binding = "ACCESS_KV"
id = "9c1524fb52d64900b5ae05cca64efca3"

# Secret: KOFI_VERIFICATION_TOKEN
# Set via `wrangler secret put KOFI_VERIFICATION_TOKEN` (paste from
# https://ko-fi.com/manage/webhooks). NOT committed.

# Required secret: EMAIL_PEPPER (stashfm.app early access, src/access.js).
# Keys the email hash in access:<hash>, so the list can't be checked against a
# guessed email without it. Set the SAME value on the website Worker
# (web/wrangler.jsonc; its sign-in refuses to run without one) and in the
# EMAIL_PEPPER environment variable when you run scripts/import-kofi-csv.mjs, and
# set it before any access:* entry exists: changing it later locks every
# supporter out until they're re-imported.

# The welcome email for a donor new to the early-access list (src/welcome.js):
# the stash-mailer Worker (rawnaldclark/stash-web-workspace, mailer/), on the same
# account. Deploy stash-mailer BEFORE this Worker: a deploy fails while the
# service it binds doesn't exist.
[[services]]
binding = "MAILER"
service = "stash-mailer"

# Secret: MAILER_TOKEN, the same value as stash-mailer's MAILER_TOKEN
# (`wrangler secret put MAILER_TOKEN`). Without it no welcome is sent; the
# webhook works as before.

# Daily at 04:17 UTC: rebuilds the supporters list from the supporter:* keys
# (src/supporters.js), so a donor that two webhooks at once (or KV's list()
# lagging) left off the list is back on it within a day. Cheap: one KV list()
# per 1,000 supporters, and a write only when the list changed.
[triggers]
crons = ["17 4 * * *"]

# The supporter claim (src/claim.js): a per-IP burst limit on POST /claim/email/start and /verify (keys are
# "<route>:<hashed IP>"). The binding only counts over 10 or 60 seconds; the hourly limits (5 starts per IP,
# 3 per email) are KV counters in ACCESS_KV (claimrl:*). Namespace 1004: 1001-1003 and 2010-2021 are taken
# on this account.
[[ratelimits]]
name = "CLAIM_RL"
namespace_id = "1004"
simple = { limit = 10, period = 60 }

# Secret: ENTITLEMENT_PRIVATE_KEY (the supporter claim, src/entitlement.js): standard base64 of the PKCS#8 DER
# Ed25519 private key that signs supporter tokens. NOT committed. Without it /claim/email/start and /verify
# answer 503. The matching public key is in README.md ("Supporter claim"). The claim also needs EMAIL_PEPPER,
# MAILER and MAILER_TOKEN (above), and stash-mailer's POST /supporter-claim route.
