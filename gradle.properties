# 4 GB: R8 shrinking the release build (and lint running beside it) runs out of memory at 2 GB.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# The Kotlin compile daemon would otherwise take the same 4 GB ceiling as a second process; 2 GB is what it
# has always had (it inherited the old 2 GB Gradle heap).
kotlin.daemon.jvmargs=-Xmx2g
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
